plugins {
    id 'java-library'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '6.0.24'
}

version = '1.0'
group = 'com.mcef'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.4'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'mcef'
            
            mods {
                mcef {
                    source sourceSets.main
                }
            }
        }
        
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'mcef'
            
            mods {
                mcef {
                    source sourceSets.main
                }
            }
        }
        
        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            
            args '--mod', 'mcef', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            
            mods {
                mcef {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

// Configuración de sourceSets para incluir JCEF
sourceSets {
    jcef {
        java {
            srcDir "../common/java-cef/java"
            exclude "**/tests/**"
        }
    }
    main {
        compileClasspath += jcef.output
        runtimeClasspath += jcef.output
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.4-49.2.0'
}

processResources.dependsOn(processJcefResources)

tasks.named('jar', Jar).configure {
    from sourceSets.jcef.output.classesDirs
    from sourceSets.jcef.output.resourcesDir
    
    manifest {
        attributes([
            'Specification-Title': 'mcef',
            'Specification-Vendor': 'mcef',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'mcef',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}